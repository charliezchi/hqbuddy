[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hqbuddy"
version = "0.0.1"
description = "HqBuddy - HqFPGA 辅助工具集"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
hqbuddy = "hqbuddy.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hqbuddy*"]

[tool.setuptools.package-data]
scripts = ["*.tcl"]
